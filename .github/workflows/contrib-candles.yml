name: Contribution candles

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contrib-candles
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        run: python scripts/contrib_candles.py --self-test
      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contrib_candles.py --login "${{ github.repository_owner }}" --out assets
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-candles-*.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh contribution candles"
          git push
